<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>童谣时光屋文创视觉探索</title><meta name="description" content="在现有童谣时光屋界面中比较三套授权清楚的图标。"><style>
/* Hallmark: existing storybook system; scope: icon comparison; typography: preserved. */
/* Critique: compare complete families in separate page previews, preserve current layout. */
:root{--bg:#fffdf5;--ink:#49352d;--line:#ead8bc;--primary:#a94736;--font:'Microsoft YaHei',sans-serif}html,body{overflow-x:clip}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:14px var(--font)}main{max-width:1240px;margin:auto}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}button,select,a{font:inherit;color:inherit}button,select{padding:8px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary)}h1,h2{text-wrap:balance}button:active{background:var(--line)}button:disabled{background:var(--line);color:var(--ink);cursor:not-allowed}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:18px;margin:0 0 8px}.frame{overflow:auto}iframe{width:375px;height:790px;border:1px solid var(--line);background:var(--bg)}.source{display:block;margin:8px 0 16px;color:var(--primary)}@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
</style><main><h1>让文创走进童谣时光屋</h1><p>三套真实素材方案，均保留书本、浅米黄背景和已确认的 C 图标。正文统一试用思源黑体简体，标题分别比较三种开源字体。</p><div class="controls"><select id="page" aria-label="页面"><option value="home">首页</option><option value="learn">学习天地</option></select><select id="state" aria-label="状态"><option value="first">首次使用</option><option value="recent">有学习记录</option></select><select id="size" aria-label="宽度"><option>375</option><option>320</option><option>430</option></select><button id="motion">暂停角色动效</button></div><div class="grid"><section><h2>A / 3D 陪读</h2><p>标题：霞鹜文楷 TC</p><div class="frame"><iframe title="3D 陪读" data-plan="a" src="a-home-first.html"></iframe></div></section><section><h2>B / 板绘绘本</h2><p>标题：站酷小薇体</p><div class="frame"><iframe title="板绘绘本" data-plan="b" src="b-home-first.html"></iframe></div></section><section><h2>C / 岭南书卷</h2><p>标题：马善政楷体</p><div class="frame"><iframe title="岭南书卷" data-plan="c" src="c-home-first.html"></iframe></div></section></div><p>素材来自你提供的文创目录，字体均为 SIL OFL 1.1。仅作浏览器预览，未改正式页面。<a href="materials.html">查看素材、字体及后续页面用法</a></p></main><script>const frames=[...document.querySelectorAll('iframe')];function update(){frames.forEach(f=>{f.src=f.dataset.plan+'-'+document.querySelector('#page').value+'-'+document.querySelector('#state').value+'.html';f.style.width=document.querySelector('#size').value+'px'})}['page','state','size'].forEach(id=>document.querySelector('#'+id).onchange=update);let pause=false;document.querySelector('#motion').onclick=()=>{pause=!pause;frames.forEach(f=>f.contentDocument.querySelectorAll('.float-art').forEach(el=>el.style.animationPlayState=pause?'paused':'running'));document.querySelector('#motion').textContent=pause?'播放角色动效':'暂停角色动效'};</script></html>
