<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>童谣播放器</title><link rel="stylesheet" href="../audio-options/audio.css"><link rel="stylesheet" href="../paper-global/global-paper.css"><link rel="stylesheet" href="player.css">
<body><main><header><a href="../audio-directory/list.html">‹ 目录</a><span>音频学习</span><small>交互演示</small></header><section id="sheet" hidden><div class="caption"><span id="lesson"></span><span id="folio"></span></div><div class="name"><h1 id="title"></h1><button id="fav" aria-label="收藏"></button></div>
<div class="verse" tabindex="0" aria-label="完整歌词"></div><div class="times"><output id="time">0:00</output><span>1:00</span></div><input id="seek" type="range" min="0" max="60" value="0" aria-label="播放进度"><div class="controls"><button id="prev" aria-label="上一首">上一首</button><button id="play">播放</button><button id="next" aria-label="下一首">下一首</button></div>
<div class="tools"><label><select id="mode" aria-label="播放模式"><option>顺序播放</option><option>单曲循环</option><option>随机播放</option></select></label><button id="record">跟唱录音</button><button id="listen" disabled>回听</button></div><p id="recordState" role="status"></p><details><summary>童谣讲解与传唱小贴士</summary><p id="tips"></p></details></section><p id="notice" role="status">正在加载童谣…</p></main><script src="before.js"></script></body></html>
