<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>播放器字体对照</title>
<style>
@font-face{font-family:zhen;src:url('zhen.woff')}
@font-face{font-family:LXGWWenKaiGB;src:url('LXGWWenKaiGB.woff')}
@font-face{font-family:LXGWWenKai;src:url('LXGWWenKai.woff')}
@font-face{font-family:wen;src:url('../wenkai.ttf')}@font-face{font-family:sanssc;src:url('notosanssc.ttf')}@font-face{font-family:serifsc;src:url('notoserifsc.ttf')}
*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:16px;background:#fffdf5;color:#483a30;font:16px system-ui}h1{font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}article{border-top:2px solid #b8a68a;padding:10px 0}h2{font:600 16px system-ui}p{margin:9px 0}a{color:inherit}iframe{display:block;width:min(100%,390px);height:800px;border:1px solid #c5b49c;margin-top:12px}select{padding:6px;font:inherit}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}} .zoom{font-size:64px;line-height:1.1}</style><h1>播放器字体对照</h1><div class="grid"></div><p>放大单字 64px　录音、回听 16px　小贴士 17px　歌名 32px</p>
<h2>播放器交互预览</h2><iframe title="播放器交互预览" src="../index.html"></iframe>
<script>
for(const [name,font,url,license] of [
 ['现版　霞鹜文楷 TC','wen','https://github.com/lxgw/LxgwWenKaiTC','../LICENSE-wenkai.txt'],
 ['C　霞鹜文楷原版','LXGWWenKai','https://github.com/lxgw/LxgwWenKai','LXGWWenKai-license.txt'],
 ['D　霞鹜文楷 GB','LXGWWenKaiGB','https://github.com/lxgw/LxgwWenKaiGB','LXGWWenKaiGB-license.txt'],
 ['E　霞鹜臻楷 GB','zhen','https://github.com/lxgw/LxgwZhenKai/releases/tag/v0.827','zhen-license.txt'],
 ['A　Noto Sans SC','sanssc','https://github.com/google/fonts/tree/main/ofl/notosanssc','notosanssc-OFL.txt'],
 ['B　Noto Serif SC','serifsc','https://github.com/google/fonts/tree/main/ofl/notoserifsc','notoserifsc-OFL.txt']]){
 const card=document.createElement('article');card.innerHTML='<h2>'+name+'</h2><div style="font:400 16px '+font+'"><p class="zoom">录</p><p>录音　回听</p><p style="font-size:17px">传唱小贴士</p><p style="font-size:32px">氹氹转</p></div><a href="'+url+'">字体来源</a> / <a href="'+license+'">SIL OFL 1.1</a>';document.querySelector('.grid').append(card);
}
</script></html>
