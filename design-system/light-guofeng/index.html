<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻国风前后对比</title><style>:root{--bg:#fffdf5;--ink:#49352d;--edge:#ead8bc}html,body{overflow-x:clip}body{background:var(--bg);color:var(--ink);margin:24px;font:16px system-ui}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;gap:20px;flex-wrap:wrap}iframe{width:375px;height:740px;border:1px solid var(--edge)}select{font:inherit;padding:8px}a{color:inherit}</style><h1>首页与学习天地：轻国风前后对比</h1><p>同尺寸、同状态；学习完成数量均为演示数据，正式代码未改。</p><label>状态 <select id="state"><option value="recent">已有记录</option><option value="first">首次使用</option></select></label> <label>宽度 <select id="width"><option>375</option><option>320</option><option>430</option></select></label><div class="grid"><section><h2>首页修改前</h2><iframe title="首页修改前" src="home-before-recent.html"></iframe></section><section><h2>首页修改后</h2><iframe title="首页修改后" src="home-recent.html"></iframe></section><section><h2>学习修改前</h2><iframe title="学习修改前" src="learn-before.html?state=partial"></iframe></section><section><h2>学习修改后</h2><iframe title="学习修改后" src="learn.html?state=recent"></iframe></section></div><p>学习页重组为听／读书页入口。首页只增加细边与纸面，不改变书本与角色结构。<a href="sources.json">素材来源</a></p><script>const frames=document.querySelectorAll('iframe');document.querySelector('#state').onchange=e=>{let s=e.target.value;frames[0].src='home-before-'+s+'.html';frames[1].src='home-'+s+'.html';frames[2].src='learn-before.html?state='+(s==='first'?'first':'partial');frames[3].src='learn.html?state='+s};document.querySelector('#width').onchange=e=>frames.forEach(f=>f.style.width=e.target.value+'px')</script></html>
