<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粤语童谣时光屋</title><link rel="stylesheet" href="/design-system/archive-shared/f06c7fd0e2bf.css"><div class="native-title">粤语童谣时光屋</div><wx-page><div class="home-page">
  <div class="sky-decoration sky-dot-one"></div>
  <div class="sky-decoration sky-dot-two"></div>

  <div
    class="recent-card"
    aria-role="button"
    aria-label=""
  >
    <div class="bookmark-ribbon" aria-hidden="true"></div>
    <div class="recent-copy">
      
      <span class="recent-title">开启第一次粤语学习</span>
      <span class="recent-meta">从童谣、绘本和文化科普认识乡音</span>
    </div>
    
  </div>

  <div class="storybook-heading">
    <span class="storybook-title">粤韵故事书</span>
  </div>

  <div class="book-stage">
    <div class="book-cover"></div>
    <div class="page-stack page-stack-left"></div>
    <div class="page-stack page-stack-right"></div>

    <div class="open-book">
      <div class="book-page left-page">
        <div
          class="book-entry entry-learn"
          aria-role="button"
          aria-label="第一章，学习天地"
        >
          <div class="entry-topline">
            <span class="entry-number">第一章</span>
            <span class="entry-corner">壹</span>
          </div>
          <img
            class="entry-watermark"
            src="/static/tabbar/learn-active.png"
            mode="aspectFit"
            aria-hidden="true"
          >
          <span class="entry-title">学习天地</span>
          <span class="entry-description">童谣跟读、文化科普</span>
        </div>

        <div
          class="book-entry entry-original"
          aria-role="button"
          aria-label="第三章，原创剧场"
        >
          <div class="entry-topline">
            <span class="entry-number">第三章</span>
            <span class="entry-corner">叁</span>
          </div>
          <img
            class="entry-watermark"
            src="/static/tabbar/original-active.png"
            mode="aspectFit"
            aria-hidden="true"
          >
          <span class="entry-title">原创剧场</span>
          <span class="entry-description">原创视频、趣味绘本</span>
        </div>
      </div>

      <div class="book-spine" aria-hidden="true">
        <div class="spine-highlight"></div>
      </div>

      <div class="book-page right-page">
        <div
          class="book-entry entry-game"
          aria-role="button"
          aria-label="第二章，游戏乐园"
        >
          <div class="entry-topline">
            <span class="entry-number">第二章</span>
            <span class="entry-corner">贰</span>
          </div>
          <img
            class="entry-watermark"
            src="/static/tabbar/games-active.png"
            mode="aspectFit"
            aria-hidden="true"
          >
          <span class="entry-title">游戏乐园</span>
          <span class="entry-description">趣味闯关、快乐练习</span>
        </div>

        <div
          class="book-entry entry-profile"
          aria-role="button"
          aria-label="第四章，我的成长"
        >
          <div class="entry-topline">
            <span class="entry-number">第四章</span>
            <span class="entry-corner">肆</span>
          </div>
          <img
            class="entry-watermark"
            src="/static/tabbar/profile-active.png"
            mode="aspectFit"
            aria-hidden="true"
          >
          <span class="entry-title">我的成长</span>
          <span class="entry-description">收藏记录、学习足迹</span>
        </div>
      </div>
    </div>

    <div class="book-mark book-mark-one"></div>
    <div class="book-mark book-mark-two"></div>
  </div>

  <div class="extra-entries">
    <div
      class="extra-entry extra-community"
      aria-role="button"
      aria-label="互动社区"
    >
      <img class="extra-icon" src="/static/ui/home/互动社区.jpg" mode="aspectFit" >
      <div class="extra-copy">
        <span class="extra-title">互动社区</span>
        <span class="extra-desc">打卡排行、成就徽章</span>
      </div>
      <span class="feature-arrow">›</span>
    </div>
  </div>

  <div class="closing-note">
    <span class="closing-flower">✿</span>
    <span>每天翻一页，让乡音陪着长大</span>
    <span class="closing-flower">✿</span>
  </div>
</div>
