<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习统计</title><link rel="stylesheet" href="/design-system/archive-shared/ba4f3b5871bf.css"><div class="native-title">学习统计</div><wx-page><div class="stats-page">
  <div class="stats-shell">
    <div class="growth-overview">
      <div class="growth-copy">
        <span class="growth-kicker">成长概览</span>
        <span class="growth-title">每一次学习都算数</span>
      </div>
      <span class="growth-mark" aria-hidden="true">长</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card stat-time">
        <span class="stat-symbol">◷</span>
        <div class="stat-value-row"><span class="stat-number">2.6</span><span class="stat-unit">小时</span></div>
        <span class="stat-label">累计学习</span>
      </div>
      <div class="stat-card stat-days">
        <span class="stat-symbol">☀</span>
        <div class="stat-value-row"><span class="stat-number">11</span><span class="stat-unit">天</span></div>
        <span class="stat-label">学习天数</span>
      </div>
      <div class="stat-card stat-streak">
        <span class="stat-symbol">↗</span>
        <div class="stat-value-row"><span class="stat-number">1</span><span class="stat-unit">天</span></div>
        <span class="stat-label">连续学习</span>
      </div>
      <div class="stat-card stat-favorite">
        <span class="stat-symbol">♥</span>
        <div class="stat-value-row"><span class="stat-number">10</span><span class="stat-unit">项</span></div>
        <span class="stat-label">收藏内容</span>
      </div>

    </div>

    <div class="category-section">
      <div class="section-heading">
        <div>
          <span class="section-title">学习分布</span>
        </div>
      </div>
      <div class="category-list">
        <div class="category-item category-audio">
          <div class="category-icon">🎵</div>
          <div class="category-info">
            <div class="category-heading">
              <span class="category-name">音频学习</span>
              <span class="category-percent">30%</span>
            </div>
            <span class="category-desc">19 次记录，6 分钟</span>
            <div class="progress-track"><div class="progress-fill" style="width: 30%;"></div></div>
          </div>
        </div>
        <div class="category-item category-video">
          <div class="category-icon">🎬</div>
          <div class="category-info">
            <div class="category-heading">
              <span class="category-name">视频学习</span>
              <span class="category-percent">47%</span>
            </div>
            <span class="category-desc">30 次记录，0 分钟</span>
            <div class="progress-track"><div class="progress-fill" style="width: 47%;"></div></div>
          </div>
        </div>
        <div class="category-item category-article">
          <div class="category-icon">📖</div>
          <div class="category-info">
            <div class="category-heading">
              <span class="category-name">文章阅读</span>
              <span class="category-percent">23%</span>
            </div>
            <span class="category-desc">15 次记录，150 分钟</span>
            <div class="progress-track"><div class="progress-fill" style="width: 23%;"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
