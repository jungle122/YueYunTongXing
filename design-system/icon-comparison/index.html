<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>童谣时光屋图标选型</title><meta name="description" content="在现有童谣时光屋界面中比较三套授权清楚的图标。"><style>
/* Hallmark: existing storybook system; scope: icon comparison; typography: preserved. */
/* Critique: compare complete families in separate page previews, preserve current layout. */
:root{--bg:#fffdf5;--ink:#49352d;--line:#ead8bc;--primary:#a94736;--font:'Microsoft YaHei',sans-serif}html,body{overflow-x:clip}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:14px var(--font)}main{max-width:1240px;margin:auto}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}button,select,a{font:inherit;color:inherit}button,select{padding:8px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary)}h1,h2{text-wrap:balance}button:active{background:var(--line)}button:disabled{background:var(--line);color:var(--ink);cursor:not-allowed}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:18px;margin:0 0 8px}.frame{overflow:auto}iframe{width:375px;height:790px;border:1px solid var(--line);background:var(--bg)}.source{display:block;margin:8px 0 16px;color:var(--primary)}@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
</style><main><h1>为童谣时光屋选一套图标</h1><p>同一页面、同一字号、同一品牌色。预览取自当前 WXML 和 WXSS，数据仅用于展示，不是微信运行截图。</p><div class="controls"><select id="page" aria-label="预览页面"><option value="learn">学习天地</option><option value="home">首页故事书</option><option value="learning-stats">学习统计</option></select><select id="size" aria-label="屏幕宽度"><option>375</option><option>320</option><option>430</option></select><button id="baseline">对照当前图标</button></div><div class="grid"><section><h2>A / Lucide</h2><p>轻巧线性，ISC（含 Lucide 上游说明）</p><a class="source" href="https://lucide.dev/license" target="_blank" rel="noopener">官方授权</a><div class="frame"><iframe title="A / Lucide" data-family="lucide" src="lucide-learn.html"></iframe></div></section><section><h2>B / Tabler</h2><p>规整线性，MIT</p><a class="source" href="https://github.com/tabler/tabler-icons/blob/main/LICENSE" target="_blank" rel="noopener">官方授权</a><div class="frame"><iframe title="B / Tabler" data-family="tabler" src="tabler-learn.html"></iframe></div></section><section><h2>C / Phosphor</h2><p>柔和双色，MIT</p><a class="source" href="https://github.com/phosphor-icons/core/blob/main/LICENSE" target="_blank" rel="noopener">官方授权</a><div class="frame"><iframe title="C / Phosphor" data-family="phosphor" src="phosphor-learn.html"></iframe></div></section></div><p>推荐 C：柔和双色与故事书更贴近，图标和 Tab 栏仍属于同一套。A 更轻，B 更规整。选择后再替换小程序中的全部功能图标。</p></main><script>const frames=[...document.querySelectorAll('iframe')];let baseline=false;function update(){frames.forEach(f=>{f.src=(baseline?'current':f.dataset.family)+'-'+document.querySelector('#page').value+'.html';f.style.width=document.querySelector('#size').value+'px'})}document.querySelector('#page').onchange=update;document.querySelector('#size').onchange=update;document.querySelector('#baseline').onclick=()=>{baseline=!baseline;document.querySelector('#baseline').textContent=baseline?'返回候选方案':'对照当前图标';update()};</script></html>
