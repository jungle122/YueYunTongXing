<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>音频学习 A / C 方案对比</title><style>body{background:#fffdf5;color:#49352d;margin:24px;font:16px system-ui}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;gap:32px;flex-wrap:wrap}iframe{width:375px;height:820px;border:1px solid #ead8bc}select{font:inherit;padding:8px}a{color:inherit}</style><h1>音频学习：A 童谣小目录 / C 童谣活页册</h1><p>均为六首真实童谣，无歌单或推荐流。状态为演示数据；点击选歌可查看操作反馈，播放器页尚未设计。</p><label>状态 <select id="state"><option value="partial">部分完成</option><option value="first">首次使用</option><option value="complete">全部完成</option><option value="loading">加载中</option><option value="error">加载失败</option></select></label> <label>宽度 <select id="width"><option>375</option><option>320</option><option>430</option></select></label><div class="grid"><section><h2>A 童谣小目录</h2><iframe title="A 童谣小目录" data-key="a" src="a.html"></iframe></section><section><h2>C 童谣活页册</h2><iframe title="C 童谣活页册" data-key="c" src="c.html"></iframe></section></div><p>A 用小幅题材符号辅助目录；C 用装订纸片与题材符号增加童趣。均不使用旧的彩色图标作为封面。<a href="sources.json">素材与许可</a></p><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src=f.dataset.key+'.html?state='+e.target.value);document.querySelector('#width').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
