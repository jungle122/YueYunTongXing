<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A/C 插画增强前后对比</title><style>body{margin:24px;font:16px system-ui;background:#fffdf5;color:#49352d}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;gap:20px;flex-wrap:wrap}iframe{width:375px;height:1100px;border:1px solid #ead8bc}select{font:inherit;padding:8px}a{color:inherit}</style><h1>A / C 插画增强：前后对比</h1><p>同宽度、同状态。学习数量均为演示；新版用星星表示已收藏。</p><label>状态 <select id="state"><option value="partial">部分完成</option><option value="first">首次使用</option><option value="complete">全部完成</option><option value="loading">加载中</option><option value="error">加载失败</option></select></label> <label>宽度 <select id="width"><option>375</option><option>320</option><option>430</option></select></label><div class="grid"><section><h2>A 修改前</h2><iframe title="A 修改前" data-page="../audio-options/a.html" src="../audio-options/a.html?state=partial"></iframe></section><section><h2>A 插画增强</h2><iframe title="A 插画增强" data-page="a.html" src="a.html?state=partial"></iframe></section><section><h2>C 修改前</h2><iframe title="C 修改前" data-page="../audio-options/c.html" src="../audio-options/c.html?state=partial"></iframe></section><section><h2>C 插画增强</h2><iframe title="C 插画增强" data-page="c.html" src="c.html?state=partial"></iframe></section></div><p>现有文创：月亮阿霖、尾巴伞、龙舟小鼓手。补充插画：公鸡与小鸡、浴盆小鸭、池塘寻物，由 imagegen 生成透明底素材。纹样：Steve Schoger / Hero Patterns，CC BY 4.0，已改色、缩放。纸纹：ambientCG Paper001，CC0。<a href="sources.json">完整来源记录</a></p><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src=f.dataset.page+'?state='+e.target.value);document.querySelector('#width').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
