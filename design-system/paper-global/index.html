<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>全局纸纹与社区配色</title><style>body{margin:24px;background:#fffdf5;color:#49352d;font:16px system-ui}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;gap:20px;flex-wrap:wrap}iframe{width:375px;height:740px;border:1px solid #ead8bc}select{font:inherit;padding:8px}a{color:inherit}.swatches{display:flex;gap:20px;flex-wrap:wrap}.swatch{width:280px;padding:18px;border:1px solid;border-radius:12px}small{display:block;margin-top:4px}</style><h1>全局纸纹与互动社区配色</h1><p>统一360px纹理大小、30%清晰度，去掉首页渐变和重复的纸纹层。只修改当前两页原型；后续页面共用同一底纹。</p><label>状态 <select id="state"><option value="recent">已有记录</option><option value="first">首次使用</option></select></label> <label>宽度 <select id="size"><option>375</option><option>320</option><option>430</option></select></label><h2>互动社区局部配色</h2><div class="swatches"><div class="swatch" style="background:#fbefea;border-color:#dfbaae;color:#a94736">砖红　互动社区<small>打卡排行、成就徽章</small></div><div class="swatch" style="background:#f5eee2;border-color:#d4c0a1;color:#806044">茶棕　互动社区<small>打卡排行、成就徽章</small></div><div class="swatch" style="background:#eef2f3;border-color:#bfced2;color:#536e78">灰蓝　互动社区<small>打卡排行、成就徽章</small></div></div><div class="grid"><section><h2>修改前：绿色</h2><iframe title="修改前：绿色" data-prefix="../light-guofeng-v2/home-" src="../light-guofeng-v2/home-recent.html"></iframe></section><section><h2>A 砖红</h2><iframe title="A 砖红" data-prefix="home-brick-" src="home-brick-recent.html"></iframe></section><section><h2>B 茶棕</h2><iframe title="B 茶棕" data-prefix="home-tea-" src="home-tea-recent.html"></iframe></section><section><h2>C 灰蓝</h2><iframe title="C 灰蓝" data-prefix="home-blue-" src="home-blue-recent.html"></iframe></section></div><h2>学习天地纸纹前后对比</h2><div class="grid"><section><h2>修改前</h2><iframe title="学习前" data-learn="../light-guofeng-v2/learn.html" src="../light-guofeng-v2/learn.html?state=recent"></iframe></section><section><h2>全局纸纹</h2><iframe title="学习后" data-learn="learn.html" src="learn.html?state=recent"></iframe></section></div><p>Paper001 来自 ambientCG（CC0）；入口纹样作者 Steve Schoger / Hero Patterns（CC BY 4.0，已改色、缩放），<a href="../light-guofeng-v2/index.html">来源与署名</a>。未修改正式代码。</p><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src=f.dataset.learn?f.dataset.learn+'?state='+e.target.value:f.dataset.prefix+e.target.value+'.html');document.querySelector('#size').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
