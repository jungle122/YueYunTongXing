<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>原创剧场三套细节对比</title><link rel="stylesheet" href="gallery.css"></head><body><header><h1>原创剧场 / 三套细节方案</h1><div class="controls"><label>同屏尺寸 <select id="size"><option>320</option><option selected>390</option><option>430</option></select></label><button id="old">显示修改前</button></div><p>上方视频、中间绘本、下方手册。三套均可点击体验入口。</p></header><main class="gallery"><section><h2>A 规整拼图</h2><p>大小画面交错，薄纸托底</p><a href="collage.html?v=a" target="_blank">单独查看</a><iframe src="collage.html?v=a" title="A 规整拼图"></iframe></section><section><h2>B 错落拼贴</h2><p>不规则外轮廓，回形针连接</p><a href="collage.html?v=b" target="_blank">单独查看</a><iframe src="collage.html?v=b" title="B 错落拼贴"></iframe></section><section><h2>C 夹页便笺</h2><p>蓝灰衬纸，内页夹成小册</p><a href="collage.html?v=c" target="_blank">单独查看</a><iframe src="collage.html?v=c" title="C 夹页便笺"></iframe></section><section id="before" hidden><h2>修改前</h2><p>保留上一版三段布局</p><a href="before-collage.html" target="_blank">单独查看</a><iframe src="before-collage.html" title="修改前"></iframe></section></main><footer><p>胶卷、书堆、回形针：你提供的参考图，经图像工具抠图及横向适配；原始出处和授权尚未核实，仅作当前原型比较。拼图使用项目内《氹氹转》《月光光》《齐齐望过去》的内页。</p><p>视频与绘本入口沿用本阶段的演示弹窗，手册保留加载和重试状态。</p></footer><script>document.querySelector('#size').onchange=e=>document.documentElement.style.setProperty('--screen',e.target.value+'px');document.querySelector('#old').onclick=e=>{const b=document.querySelector('#before');b.hidden=!b.hidden;e.target.textContent=b.hidden?'显示修改前':'隐藏修改前';if(!b.hidden)b.scrollIntoView({behavior:'smooth',block:'start'});};</script></body></html>
