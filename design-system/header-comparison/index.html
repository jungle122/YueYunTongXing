<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时光屋顶部布局对比</title><meta name="description" content="在现有童谣时光屋界面中比较三套授权清楚的图标。"><style>
/* Hallmark: existing storybook system; scope: icon comparison; typography: preserved. */
/* Critique: compare complete families in separate page previews, preserve current layout. */
:root{--bg:#fffdf5;--ink:#49352d;--line:#ead8bc;--primary:#a94736;--font:'Microsoft YaHei',sans-serif}html,body{overflow-x:clip}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:14px var(--font)}main{max-width:1240px;margin:auto}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}button,select,a{font:inherit;color:inherit}button,select{padding:8px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary)}h1,h2{text-wrap:balance}button:active{background:var(--line)}button:disabled{background:var(--line);color:var(--ink);cursor:not-allowed}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:18px;margin:0 0 8px}.frame{overflow:auto}iframe{width:375px;height:790px;border:1px solid var(--line);background:var(--bg)}.source{display:block;margin:8px 0 16px;color:var(--primary)}@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
</style><main><h1>顶部布局，三种书页形式</h1><p>保留已确认的 C 图标、浅米黄背景和现有字号。先比较布局，正式页面保持不变。</p>
<div class="controls"><select id="page" aria-label="页面"><option value="learn">学习天地</option><option value="home">首页</option><option value="learning-stats">学习统计</option></select><select id="state" aria-label="最近学习状态"><option value="first">首次使用</option><option value="recent">有学习记录</option></select><select id="size" aria-label="预览宽度"><option>375</option><option>320</option><option>430</option></select></div><div class="grid"><section><h2>A / 书页标题</h2><p>去掉外框，以留白和细线分层</p><div class="frame"><iframe title="书页标题" data-variant="a" src="a-learn-first.html"></iframe></div></section><section><h2>B / 书签题签</h2><p>窄书签标识章节，标题留在纸面上</p><div class="frame"><iframe title="书签题签" data-variant="b" src="b-learn-first.html"></iframe></div></section><section><h2>C / 目录栏</h2><p>章节与标题横向排列，入口更紧凑</p><div class="frame"><iframe title="目录栏" data-variant="c" src="c-learn-first.html"></iframe></div></section></div><p>建议优先看 A：顶部更轻，书本主体更突出；B 的书签感更强；C 更紧凑。首页展示数据仅用于预览，未连接真实学习记录。</p></main>
<script>const frames=[...document.querySelectorAll('iframe')];function update(){const p=document.querySelector('#page').value,s=document.querySelector('#state').value;document.querySelector('#state').disabled=p!=='home';frames.forEach(f=>{f.src=f.dataset.variant+'-'+p+'-'+s+'.html';f.style.width=document.querySelector('#size').value+'px'})}['page','state','size'].forEach(id=>document.getElementById(id).onchange=update);update();</script></html>
