</style><main><h1>C 方案细化：文楷与宋体</h1><p>大标题保留马善政楷体，正文、标签、按钮和数据分别比较两种字体。月亮阿霖改为透明底，书本结构与继续学习按钮同步优化。</p><div class="controls"><select id="state" aria-label="学习状态"><option value="recent">最近学习</option><option value="first">首次使用</option></select><select id="size" aria-label="宽度"><option>375</option><option>320</option><option>430</option></select><button id="transparent">查看透明素材</button></div><div class="grid"><section><h2>霞鹜文楷 TC</h2><div class="frame"><iframe title="霞鹜文楷 TC" data-font="wenkai" src="wenkai-recent.html"></iframe></div></section><section><h2>宋体</h2><div class="frame"><iframe title="宋体" data-font="song" src="song-recent.html"></iframe></div></section></div><p>预览中的“月光光”为展示记录。“童谣”为资源类型。宋体调用本机已安装字体，不打包分发字体文件。正式小程序未改。</p><dialog id="cutout"><form method="dialog"><button>关闭</button></form><p>透明背景素材</p><img src="assets/moon-alin-transparent.png" alt="透明背景月亮阿霖" style="max-width:80%;max-height:65vh"></dialog></main><script>const frames=[...document.querySelectorAll('iframe')];function update(){frames.forEach(f=>{f.src=f.dataset.font+'-'+document.querySelector('#state').value+'.html';f.style.width=document.querySelector('#size').value+'px'})}['state','size'].forEach(id=>document.getElementById(id).onchange=update);document.querySelector('#transparent').onclick=()=>document.querySelector('#cutout').showModal();</script></html>
