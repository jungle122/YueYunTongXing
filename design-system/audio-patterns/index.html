<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A/C 现成纹样素材预览</title><style>body{margin:24px;background:#fffdf5;color:#49352d;font:16px system-ui}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;gap:20px;flex-wrap:wrap}iframe{width:375px;height:1000px;border:1px solid #ead8bc}select{font:inherit;padding:8px}a{color:inherit}</style><h1>A / C：现成纹样融入版</h1><p>从未加插画版继续。A 将星星与播放键同排；C 用局部纹样与纸片结构组织内容。同尺寸、同状态对比，数量为演示数据。</p><label>状态 <select id="state"><option value="partial">部分完成</option><option value="first">首次使用</option><option value="complete">全部完成</option><option value="loading">加载中</option><option value="error">加载失败</option></select></label> <label>宽度 <select id="width"><option>375</option><option>320</option><option>430</option></select></label><div class="grid"><section><h2>A 原版目录</h2><iframe title="A 原版目录" data-page="../audio-options/a.html" src="../audio-options/a.html?state=partial"></iframe></section><section><h2>A 纹样纸片</h2><iframe title="A 纹样纸片" data-page="a.html" src="a.html?state=partial"></iframe></section><section><h2>C 原版活页</h2><iframe title="C 原版活页" data-page="../audio-options/c.html" src="../audio-options/c.html?state=partial"></iframe></section><section><h2>C 纹样活页</h2><iframe title="C 纹样活页" data-page="c.html" src="c.html?state=partial"></iframe></section></div><p>素材：<a href="https://heropatterns.com/">Steve Schoger / Hero Patterns</a> 的 Leaf、Endless Clouds、Bamboo、Overlapping Circles、Temple、Wiggle；<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>，已改色与缩放。素材名称不代表中国传统纹样考据。<a href="sources.json">来源记录</a>。图标Phosphor MIT；纸纹Paper001 CC0。</p><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src=f.dataset.page+'?state='+e.target.value);document.querySelector('#width').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
