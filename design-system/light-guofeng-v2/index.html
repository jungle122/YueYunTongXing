<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>纹样精修前后对比</title><style>body{margin:24px;font:16px system-ui;background:#fffdf5;color:#49352d}h1{font-size:24px}h2{font-size:18px}.grid{display:flex;flex-wrap:wrap;gap:20px}iframe{width:375px;height:740px;border:1px solid #ead8bc}select{font:inherit;padding:8px}a{color:inherit}</style><h1>纸纹与入口纹样：前后对比</h1><p>Paper001：学习页纸面与两张书页、首页书本内页。已增强可见度。所有数量为演示数据。</p><label>状态 <select id="state"><option value="recent">已有记录</option><option value="first">首次使用</option></select></label> <label>宽度 <select id="size"><option>375</option><option>320</option><option>430</option></select></label><div class="grid"><section><h2>首页修改前</h2><iframe title="首页修改前" src="../light-guofeng/home-recent.html"></iframe></section><section><h2>首页纸纹增强</h2><iframe title="首页纸纹增强" src="home-recent.html"></iframe></section><section><h2>学习修改前</h2><iframe title="学习修改前" src="../light-guofeng/learn.html?state=recent"></iframe></section><section><h2>学习纹样精修</h2><iframe title="学习纹样精修" src="learn.html?state=recent"></iframe></section></div><p>纹样：<a href="https://heropatterns.com/">Endless Clouds、Temple — Steve Schoger / Hero Patterns</a>，<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>，仅改色、缩放并降低对比度。不是对传统纹样名称的考据。</p><p>纸纹：<a href="https://ambientcg.com/view?id=Paper001">ambientCG Paper001</a>，CC0。原有文创扇面、字体与图标不变。正式代码未修改。</p><script>let fs=document.querySelectorAll('iframe');document.querySelector('#state').onchange=e=>{let s=e.target.value;fs[0].src='../light-guofeng/home-'+s+'.html';fs[1].src='home-'+s+'.html';fs[2].src='../light-guofeng/learn.html?state='+s;fs[3].src='learn.html?state='+s};document.querySelector('#size').onchange=e=>fs.forEach(f=>f.style.width=e.target.value+'px')</script></html>
