<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习天地：四套拟物预览</title><style>:root{--bg:#fffdf5;--ink:#49352d;--line:#ead8bc}html,body{overflow-x:clip}body{margin:24px;background:var(--bg);color:var(--ink);font:16px system-ui}main{max-width:1720px;margin:auto}h1{font-size:24px}h2{font-size:18px}p{line-height:1.6}select,button{font:inherit;padding:8px}a{color:inherit}.grid{display:flex;gap:24px;flex-wrap:wrap}iframe{width:375px;height:700px;border:1px solid var(--line)}:focus-visible{outline:2px solid var(--ink)}</style><main><h1>学习天地：四套拟物预览</h1><p>仅比较当前页，均待确认。完成数量为演示数据；总量按当前目录：6 首音频、4 篇文章。</p><label>状态 <select id="state"><option value="partial">部分完成</option><option value="first">未开始</option><option value="complete">全部完成</option></select></label> <label>宽度 <select id="width"><option>375</option><option>320</option><option>430</option></select></label> <a href="index.html">上一版</a><div class="grid"><section><h2>A 页签课册</h2><iframe title="页签课册" data-key="a" src="learn-a.html"></iframe></section><section><h2>B 唱片与书函</h2><iframe title="唱片与书函" data-key="b" src="learn-b.html"></iframe></section><section><h2>C 夹页手账</h2><iframe title="夹页手账" data-key="c" src="learn-c.html"></iframe></section><section><h2>D 扇面图录</h2><iframe title="扇面图录" data-key="d" src="learn-d.html"></iframe></section></div><p>建议优先比较 A 的整体性与 B 的入口辨识度。A 页签课册，B 唱片与书函，C 夹页手账，D 扇面图录。</p><p>素材：圆形扇面、卷轴冰箱贴、板绘阿霖、方形扇面，均来自现有文创目录。保留原图，用布局取景与混合模式融入纸面，尚未新增抠图。</p></main><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src='learn-'+f.dataset.key+'.html?state='+e.target.value);document.querySelector('#width').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
