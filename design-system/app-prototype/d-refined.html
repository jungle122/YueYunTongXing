<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>D 扇面图录精修</title><style>:root{--bg:#fffdf5;--ink:#49352d;--line:#ead8bc}html,body{overflow-x:clip}body{margin:24px;background:var(--bg);color:var(--ink);font:16px system-ui}main{max-width:1100px;margin:auto}h1{font-size:24px}h2{font-size:18px}select{font:inherit;padding:8px}.grid{display:flex;gap:32px;flex-wrap:wrap}iframe{width:375px;height:740px;border:1px solid var(--line)}a{color:inherit}:focus-visible{outline:2px solid var(--ink)}</style><main><h1>D 扇面图录精修</h1><p>左侧为原版 D，右侧为透明扇面精修。移除笔记本分隔页，完整呈现扇面与扇柄，保留紧凑纸张裱边。</p><label>状态 <select id="state"><option value="partial">部分完成</option><option value="first">未开始</option><option value="complete">全部完成</option></select></label> <label>宽度 <select id="size"><option>375</option><option>320</option><option>430</option></select></label> <a href="variants.html">四套方案</a><div class="grid"><section><h2>原版 D</h2><iframe title="原版D" data-page="learn-d" src="learn-d.html"></iframe></section><section><h2>精修 D</h2><iframe title="精修D" data-page="learn-d-refined" src="learn-d-refined.html"></iframe></section></div><p>数量为演示数据。两张扇面均由现有素材抠成透明底；不再使用笔记本分隔页。正式页面未修改。</p></main><script>document.querySelector('#state').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.src=f.dataset.page+'.html?state='+e.target.value);document.querySelector('#size').onchange=e=>document.querySelectorAll('iframe').forEach(f=>f.style.width=e.target.value+'px')</script></html>
