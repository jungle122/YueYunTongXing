.closeup[hidden]{display:none}</style><main><h1>按真实装订图解比较线迹</h1><p>上一版是自行绘制的示意，没有按真实针法复刻。本次保持书本、配色、字号及页面布局不变，只比较正面可见的孔位与走线。</p><div class="controls"><select id="state" aria-label="状态"><option value="recent">最近学习</option><option value="first">首次使用</option></select><select id="size" aria-label="宽度"><option>375</option><option>320</option><option>430</option></select><button id="zooms">隐藏线迹放大图</button></div><div class="grid"><section><h2>四眼订</h2><p>Four-hole</p><div class="refs"><a href="https://blog.papercraftpanda.com/wp-content/uploads/2022/01/Japanese-4-Hole-Binding-2-1024x1024.png" target="_blank" rel="noopener">作者图解</a><a href="https://boundbyhand.co.uk/blogs/news/make-japanese-stab-stitch-books" target="_blank" rel="noopener">补充参考</a></div><div class="closeup"><svg class="binding-cord" data-pattern="four" viewBox="0 0 36 300" preserveAspectRatio="none" aria-hidden="true"><path d="M24 0L24 300 M0 48L24 48 M0 116L24 116 M0 184L24 184 M0 252L24 252"/><circle class="binding-hole" cx="24" cy="48" r="1.8"/><circle class="binding-hole" cx="24" cy="116" r="1.8"/><circle class="binding-hole" cx="24" cy="184" r="1.8"/><circle class="binding-hole" cx="24" cy="252" r="1.8"/></svg></div><div class="frame"><iframe title="四眼订" data-pattern="four" src="four-recent.html"></iframe></div></section><section><h2>康熙订</h2><p>Noble / Kangxi</p><div class="refs"><a href="https://blog.papercraftpanda.com/wp-content/uploads/2022/01/Japanese-Noble-Binding-2-1024x1024.png" target="_blank" rel="noopener">作者图解</a><a href="https://guildofbookworkers.org/sites/default/files/standards/2013_EricAlstrom.pdf" target="_blank" rel="noopener">补充参考</a></div><div class="closeup"><svg class="binding-cord" data-pattern="noble" viewBox="0 0 36 300" preserveAspectRatio="none" aria-hidden="true"><path d="M24 0L24 300 M0 48L24 48 M0 116L24 116 M0 184L24 184 M0 252L24 252 M12 0L12 24 M0 24L12 24 M12 24L24 48 M24 252L12 276 M0 276L12 276 M12 276L12 300"/><circle class="binding-hole" cx="24" cy="48" r="1.8"/><ci
